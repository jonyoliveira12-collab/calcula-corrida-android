name: Check floating flame animation
on:
  push:
    branches: [qa/flames-049]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Ensure Android 16 platform
        run: |
          if [[ ! -f "$ANDROID_HOME/platforms/android-36/android.jar" ]]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36'
          fi
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -r -e class br.com.calculacorrida.OfferOverlayAnimationTest br.com.calculacorrida.avaliacao049.test/androidx.test.runner.AndroidJUnitRunner | tee instrument.txt
            adb exec-out run-as br.com.calculacorrida.avaliacao049 tar -cf - files/screenshots > flame-debug.tar
            grep -E '^OK \\([0-9]+ tests?\\)' instrument.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flame-diagnostic
          path: flame-debug.tar
          if-no-files-found: ignore

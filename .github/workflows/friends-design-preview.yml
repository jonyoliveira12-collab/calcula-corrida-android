name: Friends design screenshots

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  device-check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [36]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Ensure Android 16 platform is installed
        run: |
          if [[ ! -f "$ANDROID_HOME/platforms/android-36/android.jar" ]]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36'
          fi
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell pm grant br.com.calculacorrida.avaliacao051 android.permission.POST_NOTIFICATIONS
            adb shell am instrument -w -r -e class br.com.calculacorrida.FriendsPrivacyTest,br.com.calculacorrida.FriendsDesignTest,br.com.calculacorrida.DriverRefreshTest br.com.calculacorrida.avaliacao051.test/androidx.test.runner.AndroidJUnitRunner | tee instrumentation.txt
            adb exec-out run-as br.com.calculacorrida.avaliacao051 tar -cf - files/screenshots > card-previews.tar
            grep -E '^OK \([0-9]+ tests?\)' instrumentation.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: card-previews-${{ matrix.api }}
          path: card-previews.tar
          if-no-files-found: error


name: Check simultaneous offers and login flames
on:
  push:
    branches: [qa/dual-050]
permissions:
  contents: read
jobs:
  android-tablet:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Ensure Android 16 platform
        run: |
          if [[ ! -f "$ANDROID_HOME/platforms/android-36/android.jar" ]]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36'
          fi
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest :reader-fixture:assembleDebug
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb install -r reader-fixture/build/outputs/apk/backdrop/debug/reader-fixture-backdrop-debug.apk
            adb install -r reader-fixture/build/outputs/apk/uber/debug/reader-fixture-uber-debug.apk
            adb install -r reader-fixture/build/outputs/apk/ninetynine/debug/reader-fixture-ninetynine-debug.apk
            adb shell wm size 960x1536
            adb shell wm density 160
            adb shell am instrument -w -r -e class br.com.calculacorrida.LoginControlsTest br.com.calculacorrida.avaliacao050.test/androidx.test.runner.AndroidJUnitRunner | tee login.txt
            adb shell am instrument -w -r -e class br.com.calculacorrida.ReaderConcurrentOffersTest br.com.calculacorrida.avaliacao050.test/androidx.test.runner.AndroidJUnitRunner | tee dual.txt
            adb exec-out run-as br.com.calculacorrida.avaliacao050 tar -cf - files/screenshots > login-preview.tar || true
            grep -F 'OK (' login.txt
            grep -F 'OK (' dual.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: login-preview-050
          path: login-preview.tar
          if-no-files-found: ignore

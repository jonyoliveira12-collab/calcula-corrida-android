name: Validate motorcycle reader
on:
  pull_request:
    branches: [main]
  push:
    branches: [fix/moto-ifood-reading-2026]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # Android SDK is preinstalled on GitHub ubuntu-latest runners.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile and run unit tests
        run: gradle --no-daemon assembleDebug testDebugUnitTest
      - uses: actions/upload-artifact@v4
        with:
          name: JHONDRIVER-moto-test
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Publish public motorcycle test APK
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: moto-test-${{ github.run_number }}
          name: JHONDRIVER Moto - teste ${{ github.run_number }}
          prerelease: true
          files: app/build/outputs/apk/debug/app-debug.apk

name: Probe simultaneous driver offers

on:
  push:
    branches: [check/offers-0.4.6]

permissions:
  contents: read

jobs:
  concurrent-offers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Ensure Android 16 platform is installed
        run: |
          if [[ ! -f "$ANDROID_HOME/platforms/android-36/android.jar" ]]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36'
          fi
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest :reader-fixture:assembleDebug
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb install -r reader-fixture/build/outputs/apk/backdrop/debug/reader-fixture-backdrop-debug.apk
            adb install -r reader-fixture/build/outputs/apk/uber/debug/reader-fixture-uber-debug.apk
            adb install -r reader-fixture/build/outputs/apk/ninetynine/debug/reader-fixture-ninetynine-debug.apk
            adb shell wm size 960x1536
            adb shell wm density 160
            adb shell am instrument -w -r -e class br.com.calculacorrida.ReaderConcurrentOffersTest br.com.calculacorrida.avaliacao.test/androidx.test.runner.AndroidJUnitRunner | tee concurrent-instrumentation.txt
            grep -F 'OK (1 test)' concurrent-instrumentation.txt

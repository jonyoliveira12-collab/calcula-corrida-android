name: Verify signed APK installation
on:
  workflow_dispatch:
    inputs:
      current_version:
        type: string
        required: true
      previous_version:
        type: string
        required: true
      apk_sha256:
        type: string
        required: true
permissions:
  contents: read
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        api: [26, 33, 36]
    steps:
      - name: Download signed versions and verify exact bytes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PX_CURRENT: ${{ inputs.current_version }}
          PX_PREVIOUS: ${{ inputs.previous_version }}
          PX_SHA256: ${{ inputs.apk_sha256 }}
        run: |
          gh release download "preview-${PX_PREVIOUS}" --pattern "JHONDRIVER-${PX_PREVIOUS}.apk" --output previous.apk
          gh release download "preview-${PX_CURRENT}" --pattern "JHONDRIVER-${PX_CURRENT}.apk" --output current.apk
          printf '%s  current.apk\n' "$PX_SHA256" | sha256sum -c -
      - name: Enable acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb shell getprop ro.product.cpu.abilist
            adb install previous.apk
            adb install -r current.apk
            adb shell dumpsys package br.com.calculacorrida | grep versionName
            adb shell monkey -p br.com.calculacorrida -c android.intent.category.LAUNCHER 1
            adb logcat -d -b crash

name: Verify signed APK installation
on:
  workflow_dispatch:
    inputs:
      current_version:
        type: string
        required: true
      previous_version:
        type: string
        required: true
      apk_sha256:
        type: string
        required: true
permissions:
  contents: read
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        api: [26, 33, 36]
    steps:
      - name: Download signed versions and verify exact bytes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PX_CURRENT: ${{ inputs.current_version }}
          PX_PREVIOUS: ${{ inputs.previous_version }}
          PX_SHA256: ${{ inputs.apk_sha256 }}
        run: |
          [[ "$PX_CURRENT" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$PX_PREVIOUS" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          curl -fL --retry 2 -o previous.apk "https://github.com/${GH_REPO}/releases/download/preview-${PX_PREVIOUS}/JHONDRIVER-${PX_PREVIOUS}.apk"
          PX_DISTRIBUTION="${PX_CURRENT//./}"
          curl -fL --retry 2 -o current.zip "https://raw.githubusercontent.com/${GH_REPO}/distribution/apk${PX_DISTRIBUTION}/distribution/JHONDRIVER-${PX_CURRENT}.apk.zip"
          python -c 'import os,zipfile,pathlib; z=zipfile.ZipFile("current.zip"); name="JHONDRIVER-"+os.environ["PX_CURRENT"]+".apk"; assert z.namelist()==[name]; pathlib.Path("current.apk").write_bytes(z.read(name))'
          printf '%s  current.apk\n' "$PX_SHA256" | sha256sum -c -
      - name: Enable acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb shell getprop ro.product.cpu.abilist
            adb install previous.apk
            adb install -r current.apk
            adb shell dumpsys package br.com.calculacorrida | grep versionName
            adb shell monkey -p br.com.calculacorrida -c android.intent.category.LAUNCHER 1
            adb logcat -d -b crash

name: Build JHONDRIVER APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Ensure Android 16 platform is installed
        run: |
          if [[ ! -f "$ANDROID_HOME/platforms/android-36/android.jar" ]]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36'
          fi
      - name: Test and compile without signing secrets
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:bundleRelease

      - name: Check automatic reader configuration
        run: python .github/scripts/audit_apk.py app/build/outputs/apk/debug/app-debug.apk
      - name: Verify APK identity and signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | grep -F "package: name='br.com.calculacorrida.avaliacao'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | grep -F "targetSdkVersion:'36'"
      - uses: actions/upload-artifact@v4
        with:
          name: JHONDRIVER-unsigned-bundle-for-verification
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: JHONDRIVER
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  device-check:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Ensure Android 16 platform is installed
        run: |
          if [[ ! -f "$ANDROID_HOME/platforms/android-36/android.jar" ]]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36'
          fi
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest :reader-fixture:assembleDebug
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb install -r reader-fixture/build/outputs/apk/backdrop/debug/reader-fixture-backdrop-debug.apk
            adb install -r reader-fixture/build/outputs/apk/bank/debug/reader-fixture-bank-debug.apk
            adb install -r reader-fixture/build/outputs/apk/uber/debug/reader-fixture-uber-debug.apk
            adb install -r reader-fixture/build/outputs/apk/ninetynine/debug/reader-fixture-ninetynine-debug.apk
            adb install -r reader-fixture/build/outputs/apk/indrive/debug/reader-fixture-indrive-debug.apk
            adb shell am instrument -w -r -e class br.com.calculacorrida.ReaderServiceTest,br.com.calculacorrida.LoginControlsTest,br.com.calculacorrida.OfferCardTest,br.com.calculacorrida.OfferDashboardTest,br.com.calculacorrida.ReaderWindowTest,br.com.calculacorrida.ReaderPrivacyTest br.com.calculacorrida.avaliacao.test/androidx.test.runner.AndroidJUnitRunner | tee instrumentation.txt
            grep -E '^OK \([0-9]+ tests?\)' instrumentation.txt
            adb exec-out run-as br.com.calculacorrida.avaliacao tar -cf - files/screenshots > card-previews.tar
            adb shell wm size 960x1536
            adb shell wm density 160
            adb shell am instrument -w -r -e class br.com.calculacorrida.ReaderWindowTest,br.com.calculacorrida.ReaderConcurrentOffersTest br.com.calculacorrida.avaliacao.test/androidx.test.runner.AndroidJUnitRunner | tee tablet-instrumentation.txt
            grep -E '^OK \([0-9]+ tests?\)' tablet-instrumentation.txt
            adb shell wm size reset
            adb shell wm density reset
      - uses: actions/upload-artifact@v4
        with:
          name: card-previews
          path: card-previews.tar
          if-no-files-found: error

  publish:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      JHONDRIVER_KEYSTORE_PASSWORD: ${{ secrets.JHONDRIVER_KEYSTORE_PASSWORD }}
      JHONDRIVER_KEY_ALIAS: ${{ secrets.JHONDRIVER_KEY_ALIAS }}
      JHONDRIVER_KEY_PASSWORD: ${{ secrets.JHONDRIVER_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore private signing key
        env:
          SIGNING_KEY_BASE64: ${{ secrets.JHONDRIVER_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$SIGNING_KEY_BASE64" || -z "$JHONDRIVER_KEYSTORE_PASSWORD" || -z "$JHONDRIVER_KEY_ALIAS" || -z "$JHONDRIVER_KEY_PASSWORD" ]]; then
            echo "Configure the four private JHONDRIVER signing secrets before publishing."
            exit 1
          fi
          export JHONDRIVER_KEYSTORE_PATH="$RUNNER_TEMP/jhondriver-signing.keystore"
          echo "JHONDRIVER_KEYSTORE_PATH=$JHONDRIVER_KEYSTORE_PATH" >> "$GITHUB_ENV"
          umask 077
          printf '%s' "$SIGNING_KEY_BASE64" | base64 --decode > "$JHONDRIVER_KEYSTORE_PATH"
          keytool -exportcert -keystore "$JHONDRIVER_KEYSTORE_PATH" -storepass:env JHONDRIVER_KEYSTORE_PASSWORD -alias "$JHONDRIVER_KEY_ALIAS" -file "$RUNNER_TEMP/signing-cert.der"
          echo "01537f8902325696735cd4db6710ec2186eb21f8007e11ed74d757f8af30d5b8  $RUNNER_TEMP/signing-cert.der" | sha256sum --check
      - name: Build signed update
        run: gradle --no-daemon assembleRelease
      - name: Check signed automatic reader configuration
        run: python .github/scripts/audit_apk.py app/build/outputs/apk/release/app-release.apk
      - name: Verify signed APK
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: JHONDRIVER-signed
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
      - name: Create compatible update metadata
        run: python .github/scripts/write_update_manifest.py
      - name: Publish signed APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-build-${{ github.run_number }}
          name: JHONDRIVER APK build ${{ github.run_number }}
          prerelease: true
          files: |
            app/build/outputs/apk/release/app-release.apk
            update.json
      - name: Remove temporary key
        if: always()
        run: rm -f -- "$JHONDRIVER_KEYSTORE_PATH" "$RUNNER_TEMP/signing-cert.der"

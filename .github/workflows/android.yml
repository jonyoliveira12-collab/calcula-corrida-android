name: Upload tested JHONDRIVER APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-tested-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify the signed installation and update metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'CHECK'
          import hashlib, json
          from pathlib import Path
          apk = Path('distribution/JHONDRIVER-0.5.1.apk')
          metadata = json.loads(Path('distribution/update.json').read_text())
          assert metadata['packageName'] == 'br.com.calculacorrida'
          assert metadata['versionCode'] == 17 and metadata['versionName'] == '0.5.1'
          assert metadata['channel'] == 'stable'
          assert metadata['certificateSha256'] == 'd83716fc3266eed7046de4cfc5c30f87dfce4e47387d0e53f223fa3dfb83a9b7'
          assert metadata['sha256'] == hashlib.sha256(apk.read_bytes()).hexdigest()
          assert metadata['apkUrl'] == 'https://github.com/jonyoliveira12-collab/calcula-corrida-android/releases/download/preview-0.5.1/JHONDRIVER-0.5.1.apk'
          print('Signed APK metadata verified')
          CHECK
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs distribution/JHONDRIVER-0.5.1.apk | tee certificate.txt
          grep -Fx 'Signer #1 certificate SHA-256 digest: d83716fc3266eed7046de4cfc5c30f87dfce4e47387d0e53f223fa3dfb83a9b7' certificate.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging distribution/JHONDRIVER-0.5.1.apk | grep -F "package: name='br.com.calculacorrida' versionCode='17'"
      - name: Upload the tested installation to the draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release upload preview-0.5.1 distribution/JHONDRIVER-0.5.1.apk distribution/update.json --clobber

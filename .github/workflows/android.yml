name: Build JHONDRIVER APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Gera a chave apenas uma vez e a guarda no próprio repositório.
      # É uma chave exclusiva de debug/testes, nunca usar para publicar na Play Store.
      - name: Create persistent debug signing key if needed
        run: |
          if [ ! -f app/jhondriver-debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore app/jhondriver-debug.keystore \
              -storepass 'JHondriverDebug2026!' \
              -alias jhondriver \
              -keypass 'JHondriverDebug2026!' \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname 'CN=JHONDRIVER Debug, OU=Android, O=JHONDRIVER, L=Brazil, S=Brazil, C=BR'
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/jhondriver-debug.keystore
            git commit -m "Save persistent JHONDRIVER debug signing key"
            git push
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Verify APK signature
        run: |
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: JHONDRIVER-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish direct APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-build-${{ github.run_number }}
          name: JHONDRIVER APK build ${{ github.run_number }}
          prerelease: true
          files: app/build/outputs/apk/debug/*.apk

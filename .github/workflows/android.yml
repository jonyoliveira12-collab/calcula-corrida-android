name: Build JHONDRIVER APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Test and compile without signing secrets
        run: gradle --no-daemon testDebugUnitTest assembleDebug

      - name: Verify test APK identity and signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | grep -F "package: name='br.com.calculacorrida.teste'"
      - uses: actions/upload-artifact@v4
        with:
          name: JHONDRIVER-TESTE
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      JHONDRIVER_KEYSTORE_PASSWORD: ${{ secrets.JHONDRIVER_KEYSTORE_PASSWORD }}
      JHONDRIVER_KEY_ALIAS: ${{ secrets.JHONDRIVER_KEY_ALIAS }}
      JHONDRIVER_KEY_PASSWORD: ${{ secrets.JHONDRIVER_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore private signing key
        env:
          SIGNING_KEY_BASE64: ${{ secrets.JHONDRIVER_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$SIGNING_KEY_BASE64" || -z "$JHONDRIVER_KEYSTORE_PASSWORD" || -z "$JHONDRIVER_KEY_ALIAS" || -z "$JHONDRIVER_KEY_PASSWORD" ]]; then
            echo "Configure the four private JHONDRIVER signing secrets before publishing."
            exit 1
          fi
          export JHONDRIVER_KEYSTORE_PATH="$RUNNER_TEMP/jhondriver-signing.keystore"
          echo "JHONDRIVER_KEYSTORE_PATH=$JHONDRIVER_KEYSTORE_PATH" >> "$GITHUB_ENV"
          umask 077
          printf '%s' "$SIGNING_KEY_BASE64" | base64 --decode > "$JHONDRIVER_KEYSTORE_PATH"
          keytool -exportcert -keystore "$JHONDRIVER_KEYSTORE_PATH" -storepass:env JHONDRIVER_KEYSTORE_PASSWORD -alias "$JHONDRIVER_KEY_ALIAS" -file "$RUNNER_TEMP/signing-cert.der"
          echo "01537f8902325696735cd4db6710ec2186eb21f8007e11ed74d757f8af30d5b8  $RUNNER_TEMP/signing-cert.der" | sha256sum --check
      - name: Build signed update
        run: gradle --no-daemon assembleRelease
      - name: Verify signed APK
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: JHONDRIVER-signed
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish signed APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-build-${{ github.run_number }}
          name: JHONDRIVER APK build ${{ github.run_number }}
          prerelease: true
          files: app/build/outputs/apk/release/app-release.apk
      - name: Remove temporary key
        if: always()
        run: rm -f -- "$JHONDRIVER_KEYSTORE_PATH" "$RUNNER_TEMP/signing-cert.der"
